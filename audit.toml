# cargo-audit configuration for Paper
# Each ignored advisory has a documented architectural justification.

[advisories]
ignore = [
    # zip 1.3.1: Transitive dependency pulled in solely by candle-core 0.8.4 for reading
    # PyTorch (.pt/.pth) checkpoints. Paperscope exclusively loads models from .safetensors files
    # and its own archive extraction uses zip 9.8.0. The vulnerable code path in zip 1.3.1 is unreachable.
    "RUSTSEC-2025-0168",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",

    # rmcp 0.2.1: DNS rebinding and unbounded buffering in Streamable HTTP server/client transport.
    # Paperscope exclusively uses rmcp with stdio transport (transport-io) for local agent communication.
    # No HTTP or network transport is ever enabled or exposed.
    "RUSTSEC-2026-0189",
    "RUSTSEC-2026-0462",

    # libsqlite3-sys 0.30.1: C SQLite CVE-2026-119375 via rusqlite 0.32.1 bundled SQLite.
    # Paperscope runs SQLite strictly as a local-first embedded query engine without untrusted remote SQL.
    "RUSTSEC-2026-0459",

    # zip 1.3.1: Additional zip 1.3.1 advisory (insecure AES entry authentication check).
    # Paperscope exclusively loads models from .safetensors files and its own archive
    # extraction uses zip 9.8.0. The vulnerable code path in zip 1.3.1 is unreachable.
    "RUSTSEC-2026-0543",

    # number_prefix 0.4.0: Transitive dependency marked unmaintained.
    # No security vulnerability; crate is feature-complete and unchanged behavior is acceptable.
    "RUSTSEC-2025-0119",

    # paste 1.0.15: Transitive dependency marked unmaintained.
    # No security vulnerability; macro crate with stable, frozen behavior.
    "RUSTSEC-2024-0436",

    # rand 0.7.3: Transitive dependency flagged unsound only with a custom logger using rand::rng().
    # Paperscope does not use rand::rng() with a custom logger; this code path is unreachable.
    "RUSTSEC-2026-0097",
]
