# Fuzz targets for cargo-fuzz.
# Run with: cargo fuzz run <target> -- -max_total_time=60

[workspace]

[package]
name = "paper-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"

# Parser dependencies
lopdf = "0.47"
calamine = "0.38"
quick-xml = "0.42"
zip = { version = "9.7", default-features = false, features = ["deflate"] }
tar = "0.4"

[[bin]]
name = "pdf"
path = "pdf.rs"

[[bin]]
name = "docx"
path = "docx.rs"

[[bin]]
name = "xlsx"
path = "xlsx.rs"

[[bin]]
name = "pptx"
path = "pptx.rs"

[[bin]]
name = "epub"
path = "epub.rs"

[[bin]]
name = "zip"
path = "zip.rs"

[[bin]]
name = "tar"
path = "tar.rs"