<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Paper — local-first AI document search with exact citations">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e16"/>
      <stop offset="1" stop-color="#101a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea587"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#283557"/>

  <!-- soft accent bloom -->
  <circle cx="1040" cy="60" r="180" fill="#0ea587" opacity="0.10" filter="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(64,86)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#0ea587" opacity="0.14" stroke="#0ea587"/>
    <path d="M22 18h14l10 10v20a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M36 18v10h10" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
    <line x1="26" y1="38" x2="42" y2="38" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <line x1="26" y1="46" x2="36" y2="46" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="152" y="128" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#e8ecf5">Paper</text>

  <text x="64" y="196" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e8ecf5">Search your documents. Cite every line.</text>
  <text x="64" y="236" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#9fb0c9">Local-first AI document search. One binary, a CLI and an MCP server for your agents.</text>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="64" y="264" width="120" height="34" rx="17" fill="#0ea587" opacity="0.12" stroke="#0ea587"/>
    <text x="88" y="286" fill="#5eead4">offline</text>
    <rect x="196" y="264" width="150" height="34" rx="17" fill="#0ea587" opacity="0.12" stroke="#0ea587"/>
    <text x="218" y="286" fill="#5eead4">citations</text>
    <rect x="358" y="264" width="132" height="34" rx="17" fill="#0ea587" opacity="0.12" stroke="#0ea587"/>
    <text x="380" y="286" fill="#5eead4">15+ formats</text>
    <rect x="502" y="264" width="108" height="34" rx="17" fill="#0ea587" opacity="0.12" stroke="#0ea587"/>
    <text x="524" y="286" fill="#5eead4">MCP</text>
  </g>

  <!-- citation card -->
  <g transform="translate(760,88)">
    <rect x="0" y="0" width="376" height="168" rx="16" fill="#0f1520" stroke="#283557"/>
    <rect x="0" y="0" width="376" height="40" rx="16" fill="#121b28"/>
    <circle cx="24" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="42" cy="20" r="5" fill="#febc2e"/>
    <circle cx="60" cy="20" r="5" fill="#28c840"/>
    <text x="18" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5eead4">$ paper search "warranty expiry"</text>
    <text x="18" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e8ecf5">fridge-warranty.txt:1-4</text>
    <text x="18" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9fb0c9">Coverage ends on 2027-01-15.</text>
    <text x="18" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#0ea587">1.000 · keyword + vector</text>
  </g>
</svg>
