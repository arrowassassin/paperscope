[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist 0.34). This file is the source of truth for
# the release workflow; `.github/workflows/release.yml` is generated from it
# with `dist generate --mode=ci` and then patched by
# `scripts/patch-release-ci.sh`.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# We manage the release workflow ourselves: it is generated by `dist generate
# --mode=ci` and then patched by scripts/patch-release-ci.sh (signing secrets
# and the SBOM job). Without this, dist would refuse to run because the
# committed file differs from what it would generate.
allow-dirty = ["ci"]
# Package-manager publishing. dist can publish the Homebrew formula and the
# npm package itself, but both need accounts we do not control yet:
#   publish-jobs = ["homebrew", "npm"]
# Until then the formula and the npm tarball are attached to the GitHub
# Release, so they can be published by hand.
publish-jobs = []
# The installers to generate for each app.
# dist supports shell, powershell, npm, homebrew and msi — it does *not*
# produce deb/rpm/apk packages.
installers = ["shell", "powershell", "npm", "homebrew"]
# Artifact types to generate
artifacts = ["tarball", "zip"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Additional files to include in archives
include = ["README.md", "LICENSE-MIT", "LICENSE-APACHE", "CHANGELOG.md", "docs/"]
# GitHub Releases handling
github-releases = "upload"

# Extra artifacts: model files uploaded to GitHub Releases as separate assets.
# These are architecture-independent (same files for all platforms).
# The fetch-models.sh script downloads them from Hugging Face at pinned revisions.
[[extra-artifacts]]
# BGE small English v1.5 (default, ~134 MB total)
artifacts = [
    "models/bge-small-en-v1.5/model.safetensors",
    "models/bge-small-en-v1.5/config.json",
    "models/bge-small-en-v1.5/tokenizer.json",
]
build = ["scripts/fetch-models.sh"]

[[extra-artifacts]]
# Multilingual E5 small (opt-in, ~488 MB total)
artifacts = [
    "models/multilingual-e5-small/model.safetensors",
    "models/multilingual-e5-small/config.json",
    "models/multilingual-e5-small/tokenizer.json",
]
build = ["scripts/fetch-models.sh"]

[[extra-artifacts]]
# BGE reranker base (opt-in precision, ~1.13 GB total)
artifacts = [
    "models/bge-reranker-base/model.safetensors",
    "models/bge-reranker-base/config.json",
    "models/bge-reranker-base/tokenizer.json",
]
build = ["scripts/fetch-models.sh"]