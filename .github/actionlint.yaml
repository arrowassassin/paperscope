# actionlint configuration.
#
# `.github/workflows/release.yml` is generated by `dist generate --mode=ci` and
# patched by `scripts/patch-release-ci.sh`. The shellcheck findings below come
# from the generated steps themselves (unquoted `${{ matrix.dist_args }}` and
# repeated `>> "$GITHUB_OUTPUT"` redirects), not from anything we wrote, and we
# cannot change them without editing generated code on every regeneration.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:.+'
      - 'shellcheck reported issue in this script: SC2129:.+'
