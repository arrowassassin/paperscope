name: Publish crate

# Publish `paperscope` to crates.io after the Release workflow succeeds for a
# version tag, so `cargo install paperscope` and auto-update (cargo installs)
# can see it. Not `release: published`: the release is created with
# GITHUB_TOKEN, and GitHub does not start workflows from events that token
# makes. Runs in the `config-signing` environment, so the maintainer approves
# it (Actions -> the run -> Review deployments) before the token is exposed.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.4.1)
        required: true

permissions:
  contents: read

jobs:
  publish:
    # workflow_run: only a successful tag-push release (the Release workflow
    # also runs on pull requests and branches, where head_branch is not a tag).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: config-signing
    env:
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if curl -fsS https://index.crates.io/pa/pe/paperscope | grep -q "\"vers\":\"${version}\""; then
            echo "::notice::paperscope ${version} is already on crates.io; nothing to do"
            exit 0
          fi
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          cargo publish --locked
