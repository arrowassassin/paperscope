name: Publish crate and npm

# Publish `paperscope` to crates.io after the Release workflow succeeds for a
# version tag, so `cargo install paperscope` and auto-update (cargo installs)
# can see it. Not `release: published`: the release is created with
# GITHUB_TOKEN, and GitHub does not start workflows from events that token
# makes. Runs in the `config-signing` environment, so the maintainer approves
# it (Actions -> the run -> Review deployments) before the token is exposed.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.4.1)
        required: true

permissions:
  contents: read

jobs:
  publish:
    # workflow_run: only a successful tag-push release (the Release workflow
    # also runs on pull requests and branches, where head_branch is not a tag).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: config-signing
    env:
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if curl -fsS https://index.crates.io/pa/pe/paperscope | grep -q "\"vers\":\"${version}\""; then
            echo "::notice::paperscope ${version} is already on crates.io; nothing to do"
            exit 0
          fi
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          cargo publish --locked

  # npm: publish the package the release already built (attached to the GitHub
  # release as paperscope-npm-package.tar.gz), after the same approval.
  npm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    environment: config-signing
    env:
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
    steps:
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if npm view "paperscope@${version}" version 2>/dev/null | grep -qx "${version}"; then
            echo "::notice::paperscope ${version} is already on npm; nothing to do"
            exit 0
          fi
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is not set"; exit 1; }
          curl -fsSL -o package.tgz \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/paperscope-npm-package.tar.gz"
          tar -xzOf package.tgz package/package.json | grep -q "\"version\": *\"${version}\"" \
            || { echo "package.json version does not match ${version}"; exit 1; }
          # The MCP Registry proves npm ownership through this field; it must
          # equal "name" in server.json.
          mkdir pkg && tar -xzf package.tgz -C pkg
          jq '.mcpName = "io.github.kintsugi-tools/paperscope"' pkg/package/package.json > pkg/p.json
          mv pkg/p.json pkg/package/package.json
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish ./pkg/package --access public

  # List the release in the official MCP Registry (registry.modelcontextprotocol.io).
  # GitHub OIDC proves the io.github.kintsugi-tools namespace; no stored token.
  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Set version
        run: |
          version="${TAG#v}"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > s.json && mv s.json server.json
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
