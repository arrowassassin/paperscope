name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-gnu
            x86_64-pc-windows-msvc
            x86_64-apple-darwin
            aarch64-apple-darwin

      - name: Install cargo-dist
        uses: taiki-e/install-action@cargo-dist
        with:
          tool: cargo-dist
          version: latest

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gpg \
            rpm \
            dpkg \
            fakeroot \
            binutils \
            musl-tools \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gpg rpm dpkg fakeroot

      - name: Setup GPG for Linux signing
        if: runner.os == 'Linux' && env.GPG_PRIVATE_KEY != ''
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --import --batch --yes
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

      - name: Build and sign with cargo-dist
        id: dist
        uses: cargo-dist/action@v0.34.0
        env:
          # macOS signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows signing
          WINDOWS_CERT_FILE: ${{ secrets.WINDOWS_CERT_FILE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # Linux GPG signing
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # Cargo registry token for publishing
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        with:
          # cargo-dist will read config from cargo-dist.toml
          args: --artifacts=all

      - name: Generate CycloneDX SBOM
        if: steps.dist.outputs.artifacts != ''
        run: |
          cargo install cargo-cyclonedx --locked || true
          mkdir -p target/dist
          cargo cyclonedx --format json --override-filename sbom || true
          if [ -f sbom.json ]; then
            mv -f sbom.json target/dist/sbom.json
          fi

      - name: Generate SPDX SBOM
        if: steps.dist.outputs.artifacts != ''
        run: |
          cargo install cargo-sbom --locked || true
          mkdir -p target/dist
          cargo sbom --output-format spdx_json_2_3 > target/dist/sbom.spdx.json || true

      - name: Upload SBOMs to release
        if: steps.dist.outputs.artifacts != '' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/sbom.json
            target/dist/sbom.spdx.json
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

  slsa-provenance:
    name: SLSA Provenance
    needs: release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      base64-subjects: "${{ needs.release.outputs.artifacts }}"

  publish-installers:
    name: Publish Installers
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cargo-dist
        uses: taiki-e/install-action@cargo-dist
        with:
          tool: cargo-dist
          version: latest

      - name: Publish Homebrew formula
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          cargo dist publish --installer=homebrew

      - name: Publish Scoop manifest
        if: env.SCOOP_BUCKET_GITHUB_TOKEN != ''
        env:
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
        run: |
          cargo dist publish --installer=scoop

      - name: Publish npm package
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cargo dist publish --installer=npm