name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege for a release workflow.
permissions:
  contents: write
  id-token: write
  attestations: write

# Only one release at a time for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      artifacts: ${{ steps.build.outputs.artifacts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-gnu
            x86_64-pc-windows-msvc
            x86_64-apple-darwin
            aarch64-apple-darwin

      - name: Install cargo-dist
        uses: taiki-e/install-action@cargo-dist
        with:
          tool: cargo-dist
          version: '0.34.0'

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gpg \
            rpm \
            dpkg \
            fakeroot \
            binutils \
            musl-tools \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gpg rpm dpkg fakeroot || true

      - name: Setup GPG for Linux signing
        if: runner.os == 'Linux' && env.GPG_PRIVATE_KEY != ''
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --import --batch --yes
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

      - name: Build with cargo-dist
        id: build
        env:
          # macOS signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows signing
          WINDOWS_CERT_FILE: ${{ secrets.WINDOWS_CERT_FILE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # Linux GPG signing
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          # Cargo registry token for publishing
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo dist build --artifacts=all --output-format=json > dist-manifest.json
          # shellcheck disable=SC2086
          printf 'artifacts=%s\n' "$(jq -r '.artifacts | @json' dist-manifest.json)" >> $GITHUB_OUTPUT

      - name: Upload artifacts to GitHub Release
        if: steps.build.outputs.artifacts != '' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/**/*
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          mkdir -p target/dist
          cargo cyclonedx --format json --override-filename sbom
          find . -maxdepth 2 -name 'sbom.json' -exec mv -f {} target/dist/sbom.json \;

      - name: Generate SPDX SBOM
        run: |
          cargo install cargo-sbom --locked
          mkdir -p target/dist
          cargo sbom --output-format spdx_json_2_3 > target/dist/sbom.spdx.json

      - name: Upload SBOMs to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/dist/sbom.json
            target/dist/sbom.spdx.json
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

  publish-installers:
    name: Publish Installers
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cargo-dist
        uses: taiki-e/install-action@cargo-dist
        with:
          tool: cargo-dist
          version: '0.34.0'

      - name: Publish Homebrew formula
        if: env.HOMEBREW_TAP_GITHUB_TOKEN != ''
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          cargo dist publish --installer=homebrew

      - name: Publish Scoop manifest
        if: env.SCOOP_BUCKET_GITHUB_TOKEN != ''
        env:
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
        run: |
          cargo dist publish --installer=scoop

      - name: Publish npm package
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cargo dist publish --installer=npm