name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# Superseded pushes cancel their own runs instead of queueing seven OS jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test / ${{ matrix.os }} / rust-${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platforms: a Windows-only or MSRV-only failure is
      # exactly the information this matrix exists to surface.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.91.0' # MSRV from Cargo.toml
          - os: ubuntu-latest
            rust: beta
          - os: macos-latest
            rust: stable
          - os: windows-latest
            rust: '1.91.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
          cache-on-failure: true

      # Formatting is a single-platform concern.
      - name: cargo fmt (check)
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo fmt --all --check

      - name: cargo clippy (default features)
        if: matrix.rust != 'beta'
        run: cargo clippy --all-targets -- -D warnings

      # Feature-gated code (ocr, shell-accel, jieba-rs) only compiles when its
      # feature is on, so lint it explicitly on one platform.
      - name: cargo clippy (all features)
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo check --all-targets (warning-free)
        # Beta is allowed to warn: new compiler versions add new lints, and beta
        # is here to catch breakage early, not to gate the release.
        env:
          RUSTFLAGS: ${{ matrix.rust == 'beta' && '' || '-D warnings' }}
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo llvm-cov (coverage report)
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --lcov \
            --output-path target/lcov.info \
            --ignore-filename-regex '(^|/)(tests|benches)/'

      - name: Upload coverage report (lcov)
        if: always() && matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/lcov.info
          if-no-files-found: ignore
          retention-days: 30

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-latest-stable-supply-chain

      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deny
          version: '0.19'

      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          version: '0.23'

      - name: Install cargo-cyclonedx
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-cyclonedx
          version: '0.5'

      - name: Install cargo-sbom
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-sbom
          version: '0.10'

      - name: cargo deny (licences, bans, sources)
        run: cargo deny check licenses bans sources

      - name: cargo audit (advisory database)
        run: cargo audit

      - name: Verify NOTICE is up to date
        run: |
          bash scripts/generate-notice.sh > NOTICE.generated
          if ! diff -u NOTICE NOTICE.generated; then
            echo "::error::NOTICE is out of date; run scripts/generate-notice.sh and commit the result."
            exit 1
          fi
          rm NOTICE.generated

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p target
          cargo cyclonedx --format json --override-filename sbom
          find . -maxdepth 2 -name 'sbom.json' -exec mv -f {} target/sbom.json \;

      - name: Generate SPDX SBOM
        run: |
          mkdir -p target
          cargo sbom --output-format spdx_json_2_3 > target/sbom.spdx.json

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: target/sbom.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload SPDX SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: target/sbom.spdx.json
          if-no-files-found: ignore
          retention-days: 90
