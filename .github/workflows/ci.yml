name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  # Ensure cargo tools are available
  PATH: ${{ github.workspace }}/.cargo/bin:${{ env.PATH }}

jobs:
  check:
    name: ${{ matrix.os }} / rust-${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: '1.88'
          - os: macos-latest
            rust: stable
          - os: macos-latest
            rust: beta
          - os: macos-latest
            rust: '1.88'
          - os: windows-latest
            rust: '1.88'
            # Windows MSRV only; beta/stable may not have MSVC toolchain
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          target: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ matrix.os }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ matrix.os }}-${{ matrix.rust }}-

      - name: Cache cargo target directory
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ matrix.os }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ matrix.os }}-${{ matrix.rust }}-

      - name: Cache cargo-dist artifacts
        uses: actions/cache@v4
        with:
          path: target/cargo-dist
          key: cargo-dist-${{ matrix.os }}-${{ matrix.rust }}-${{ hashFiles('cargo-dist.toml') }}
          restore-keys: |
            cargo-dist-${{ matrix.os }}-${{ matrix.rust }}-

      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deny
          version: "0.14"
          use-tool-cache: true

      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
          version: "0.21"
          use-tool-cache: true

      - name: Install cargo-cyclonedx
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-cyclonedx
          version: "0.10"
          use-tool-cache: true

      - name: Install cargo-sbom
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-sbom
          version: "0.4"
          use-tool-cache: true

      - name: Install cargo-llvm-cov
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-llvm-cov
          version: "0.6"
          use-tool-cache: true

      - name: Install cargo-vet
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-vet
          version: "0.9"
          use-tool-cache: true

      - name: cargo check --all-targets (warning-free)
        run: cargo check --all-targets
        shell: bash
        env:
          RUSTFLAGS: -D warnings

      - name: cargo test (with JUnit output)
        run: |
          cargo test -- --format=junit --output-file=target/test-results.xml
        shell: bash

      - name: cargo llvm-cov (coverage gate: fail-under 80%)
        run: |
          cargo llvm-cov --lcov --fail-under 80 \
            --exclude-filename="tests/*" \
            --exclude-filename="benches/*" \
            --exclude-filename="generated*" \
            --output-path=target/lcov.info
        shell: bash

      - name: Upload coverage report (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.rust }}
          path: target/lcov.info
          retention-days: 30

      - name: cargo vet check (supply-chain verification)
        run: |
          # Fetch imports
          cargo vet import --all
          cargo vet check
        shell: bash

      - name: cargo deny check licenses bans sources
        run: cargo deny check licenses bans sources
        shell: bash

      - name: Verify NOTICE file is up to date
        run: |
          bash scripts/generate-notice.sh > NOTICE.generated
          if ! diff -u NOTICE NOTICE.generated; then
            echo "NOTICE file is out of date. Run scripts/generate-notice.sh to update."
            exit 1
          fi
          rm NOTICE.generated
        shell: bash

      - name: cargo audit
        run: cargo audit
        shell: bash

      - name: cargo cyclonedx (CycloneDX SBOM)
        run: |
          mkdir -p target
          cargo cyclonedx --format json --override-filename sbom.json
        shell: bash

      - name: cargo sbom (SPDX SBOM)
        run: |
          cargo sbom --output-format spdx_json_2_3 > target/sbom.spdx.json
        shell: bash

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.rust }}
          path: target/test-results.xml
          retention-days: 30

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ matrix.os }}-${{ matrix.rust }}
          path: target/sbom.json
          retention-days: 90

      - name: Upload SPDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-${{ matrix.os }}-${{ matrix.rust }}
          path: target/sbom.spdx.json
          retention-days: 90

      - name: Upload cargo-deny logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-deny-logs-${{ matrix.os }}-${{ matrix.rust }}
          path: target/deny
          retention-days: 30