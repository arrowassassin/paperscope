name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fail fast on any job failure
fail-fast: true

env:
  CARGO_TERM_COLOR: always
  # Ensure cargo tools use the correct target directory
  CARGO_TARGET_DIR: target

jobs:
  check:
    name: "Rust ${{ matrix.rust }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    # Windows MSRV uses 1.88 only; beta/stable may not have MSVC
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: "1.88"
          - os: macos-latest
            rust: stable
          - os: macos-latest
            rust: beta
          - os: macos-latest
            rust: "1.88"
          - os: windows-latest
            rust: "1.88"
      fail-fast: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ matrix.rust }}-
            cargo-registry-${{ runner.os }}-

      - name: Cache cargo target directory
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ matrix.rust }}-
            cargo-target-${{ runner.os }}-

      - name: Cache cargo-dist artifacts
        uses: actions/cache@v4
        with:
          path: |
            target/cargo-dist
            dist
          key: cargo-dist-${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-dist-${{ runner.os }}-${{ matrix.rust }}-
            cargo-dist-${{ runner.os }}-

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: licenses bans sources

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Install cargo-sbom
        run: cargo install cargo-sbom --locked

      - name: Cargo check (warning-free)
        run: cargo check --all-targets --workspace
        # Fail if any warnings are emitted
        shell: bash
        env:
          RUSTFLAGS: -D warnings

      - name: Cargo test
        run: cargo test --workspace 2>&1 | tee target/test-output.txt

      - name: Cargo deny check
        run: cargo deny check licenses bans sources

      - name: Cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2024-0332 \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2024-0003 \
            --ignore RUSTSEC-2023-0034 \
            --ignore RUSTSEC-2021-0079 \
            --ignore RUSTSEC-2021-0078 \
            --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2026-0189 \
            --ignore RUSTSEC-2026-0462 \
            --ignore RUSTSEC-2021-0124 \
            --ignore RUSTSEC-2026-0548 \
            --ignore RUSTSEC-2026-0429 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369 \
            --ignore RUSTSEC-2026-0545 \
            --ignore RUSTSEC-2025-0168 \
            --ignore RUSTSEC-2021-0139 \
            --ignore RUSTSEC-2024-0375 \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2026-0543 \
            --ignore RUSTSEC-2021-0153 \
            --ignore RUSTSEC-2020-0016 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0053 \
            --ignore RUSTSEC-2021-0145 \
            --ignore RUSTSEC-2022-0022 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2025-0023 \
            --ignore RUSTSEC-2023-0005

      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --override-filename sbom.json && mv sbom.json.json target/sbom.json

      - name: Generate SPDX SBOM
        run: cargo sbom --output-format spdx_json_2_3 > target/sbom.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ runner.os }}-${{ matrix.rust }}
          path: |
            target/sbom.json
            target/sbom.spdx.json
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ runner.os }}-${{ matrix.rust }}
          path: target/test-output.txt
          retention-days: 30