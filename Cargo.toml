[workspace]
resolver = "2"
members = ["."]

[package]
# Registry identity is `paperscope`; the product, library target and installed
# binary all stay `paper`. `paper` is already taken on crates.io (v0.4.0, a
# terminal editor), and every evocative one-word alternative was already a
# competing product. See docs/implementation-status.md#naming.
name = "paperscope"
version = "0.2.10"
edition = "2021"
# Highest MSRV in the dependency tree. `candle-core` 0.11.1 needs 1.94 on
# x86_64: it calls `__cpuid_count` from safe code, and that intrinsic only
# became safe to call in 1.94 (on aarch64 the same crate builds on 1.91, but
# the declared MSRV is the maximum across platforms). `notify-types` 2.3.1
# requires 1.91; `zip` 9.8 / `aes` 0.9 require 1.89; the `icu_*` crates 1.88.
rust-version = "1.94"
description = "Local-first AI document search with exact page and line citations. One binary: CLI + MCP server for LLMs. PDF, DOCX and 15+ formats, no cloud, no telemetry."
license = "MIT OR Apache-2.0"
readme = "docs/readme.md"
repository = "https://github.com/kintsugi-tools/paperscope"
# `dist` needs an explicit homepage for the Homebrew formula it generates. Cargo
# calls it redundant (the repository URL serves the same purpose), so the
# manifest lint is silenced on purpose rather than dropping the formula.
homepage = "https://kintsugi.tools/paperscope.html"
documentation = "https://docs.rs/paperscope"
categories = ["command-line-utilities", "text-processing", "science"]
# crates.io allows five keywords; lead with what people search for (ai, llm,
# mcp) and keep the retrieval terms that describe the technique.
keywords = ["ai", "llm", "mcp", "search", "rag"]
# Explicit allow-list: this repository also holds unrelated work, and its README
# is not this project's. Never widen this without checking what ships.
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/docs/readme.md",
    "/docs/implementation-status.md",
    "/docs/LICENSE-MIT",
    "/docs/LICENSE-APACHE",
    "/NOTICE",
]

[lib]
name = "paper"
path = "src/lib.rs"

[[bin]]
name = "paper"
path = "src/main.rs"

[dependencies]
# Storage: bundled SQLite (no system dependency) + statically linked sqlite-vec.
rusqlite = { version = "0.43", features = ["bundled"] }
sqlite-vec = "0.1.9"

# Runtime / errors / serialization
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI + output
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"

# Model download
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"

# Hashing + walking
blake3 = "1.5"
walkdir = "2.5"
notify = "8"
toml = "0.8"
ordered-float = "4.0"
futures = "0.3"

# Inference: Hugging Face Candle (pure Rust, no ONNX Runtime)
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
# Paper loads pretrained tokenizers. The C++ suffix-array trainer is unnecessary.
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig", "progressbar"] }

# Optional dictionary segmenters (feature-gated)
jieba-rs = { version = "0.5", optional = true }

# ICU segmenter for word boundaries in CJK, Korean, Thai, Lao, Khmer, Myanmar,
# Arabic, Hebrew, Devanagari, etc. (Apache-2.0)
# Need compiled_data + auto features for WordSegmenter::new_auto()
icu_segmenter = { version = "1.5", optional = true, features = ["compiled_data", "auto"] }
icu_provider = { version = "1.5", optional = true }
icu_provider_adapters = { version = "1.5", optional = true }
icu_normalizer = { version = "1.5", optional = true }
icu_properties = { version = "1.5", optional = true }
icu_locid = { version = "1.5", optional = true }
writeable = { version = "0.5", optional = true }

# Lindera (pure Rust) for Japanese with IPADIC dictionary (MIT)
# `embed-ipadic` ships the dictionary inside the crate: no build-time network
# fetch (lindera 0.9 downloaded from Google Drive in build.rs, which broke and
# violated offline builds).
lindera = { version = "6", optional = true, features = ["embed-ipadic"] }

# Optional shell-out accelerators (feature-gated)
which = { version = "6.0", optional = true }

# OCR: PaddleOCR PP-OCRv4 weights executed by tract (pure Rust ONNX). No C/C++
# toolchain, no system libraries, so the static musl build stays static.
tract-onnx = { version = "0.23", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }

# Temp files with random suffixes (used by OCR engine to avoid symlink attacks).
tempfile = "3.8"

# Extraction: pure-Rust parsers, all permissive licences (see deny.toml).
lopdf = "0.47"
calamine = "0.38"
mailparse = "0.18"
zip = { version = "9.7", default-features = false, features = ["deflate"] }
tar = "0.4"
quick-xml = "0.42"
html2text = "0.17"
unicode-normalization = "0.1"

# MCP server
rmcp = { version = "3", features = ["server", "transport-io"] }
schemars = "1.0"

# Daemon: scheduling, IPC, file watching, system monitoring
async-trait = "0.1"
cron = "0.11"
sysinfo = { version = "0.33", features = ["system"] }
# battery = "0.7"  // Optional, sysinfo covers battery on most platforms

cfg-if = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
tempfile = "3.8"
httpmock = "0.6"
async-trait = "0.1"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "eval"
harness = false

# Fuzz targets are in fuzz/Cargo.toml (run with: cargo fuzz run <target>)

[features]
# Semantic search (Candle) is on by default. `--no-default-features` builds a
# keyword-only binary without Candle or the tokenizers: smaller, faster to
# compile, and no inference code in the binary at all.
default = ["embeddings", "daemon", "ocr"]
embeddings = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
jieba-rs = ["dep:jieba-rs"]

# ICU segmenter for word boundaries in CJK, Korean, Thai, Lao, Khmer, Myanmar,
# Arabic, Hebrew, Devanagari, etc. (Apache-2.0)
icu_segmenter = ["dep:icu_segmenter", "dep:icu_provider", "dep:icu_provider_adapters", "dep:icu_normalizer", "dep:icu_properties", "dep:icu_locid", "dep:writeable"]

# Lindera (pure Rust) for Japanese with IPADIC dictionary (MIT)
lindera = ["dep:lindera"]

shell-accel = ["dep:which"]
ocr = ["dep:tract-onnx", "dep:image"]
daemon = []

# `homepage` is kept on purpose: `dist` needs it for the Homebrew formula, and
# cargo's `redundant_homepage` lint only says the repository URL would do the
# same job. The lint is about redundancy, not about an error.
# [lints.cargo]
# redundant_homepage = "allow"
